<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Apdata Assistente de Implantação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ap-dark-green: #22432d;
            --ap-gold: #b09054;
            --ap-cream: #e1d6b9;
            --ap-bg-cream: #eae1c8;
            --ap-card-cream: #f4ebd3;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto', sans-serif;
            background-image: url('bg_login.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
        }

        /* Subtle dark overlay to make the login card pop */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(34, 67, 45, 0.4) 0%, rgba(10, 15, 12, 0.7) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .login-container {
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 25px;
            background: rgba(244, 235, 211, 0.92);
            padding: 20px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.4);
            width: 100%;
        }

        .logo-icon {
            font-size: 3.8rem;
            background: linear-gradient(135deg, #d4ba7b 0%, #8c723b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: -5px;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 700;
            color: var(--ap-dark-green);
            line-height: 0.9;
            letter-spacing: -1.5px;
        }

        .logo-sub {
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--ap-dark-green);
            margin-top: 12px;
            letter-spacing: -0.5px;
        }

        .login-card {
            background-color: rgba(244, 235, 211, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 35px 40px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.4);
            position: relative;
            overflow: hidden;
        }

        /* Glossy shine effect on card */
        .login-card::after {
            content: "";
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shine 6s infinite;
            pointer-events: none;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .form-label {
            font-size: 0.9rem;
            color: #222;
            margin-bottom: 4px;
        }

        .form-control {
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 0.95rem;
            color: #333;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.03);
        }

        .form-control:focus {
            background-color: #fff;
            border-color: var(--ap-gold);
            box-shadow: 0 0 0 0.2rem rgba(176, 144, 84, 0.2);
            color: #333;
            outline: none;
        }

        .btn-primary {
            background-color: var(--ap-dark-green);
            border: 1px solid var(--ap-gold);
            color: #d4ba7b;
            width: 100%;
            padding: 10px;
            font-size: 1.1rem;
            border-radius: 4px;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background-color: #183321;
            color: #ebdab2;
            border-color: #d4ba7b;
        }
        
        .btn-primary:disabled {
            background-color: #375745;
            color: #999;
            border-color: #666;
        }

        .links-container {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            font-size: 0.85rem;
        }

        .links-container a {
            color: #111;
            text-decoration: underline;
            text-decoration-color: var(--ap-dark-green);
            text-underline-offset: 3px;
        }

        .links-container a:hover {
            color: var(--ap-dark-green);
        }

        #error-msg {
            display: none;
            color: #d32f2f;
            text-align: center;
            margin-top: 15px;
            font-size: 0.85em;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <i class="fas fa-fingerprint logo-icon"></i>
            <div class="logo-text">apdata</div>
            <div class="logo-sub">Assistente de Implantação</div>
        </div>

        <div class="login-card">
            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuário</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary" id="btn-login">Entrar</button>
                <div id="error-msg">Usuário ou senha incorretos.</div>
                
                <div class="links-container">
                    <a href="#">Esqueceu a Senha?</a>
                    <a href="#">Precisa de Ajuda?</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            const btn = document.getElementById("btn-login");
            const err = document.getElementById("error-msg");

            btn.disabled = true;
            btn.innerHTML = 'Autenticando...';
            err.style.display = 'none';

            // Modo Estático / Nuvem Serverless:
            // Salva a identificação da empresa/usuário no navegador (localStorage)
            const cleanUser = user ? user.trim() : "Cliente GAIA";
            const isConsultor = cleanUser.toLowerCase().includes("consultor") || cleanUser.toLowerCase().includes("admin") || cleanUser.toLowerCase() === "apdata";
            const clientUser = {
                role: isConsultor ? "consultor" : "cliente",
                name: cleanUser,
                client_id: "cli_" + btoa(encodeURIComponent(cleanUser)).replace(/[^a-zA-Z0-9]/g, "").substring(0, 16)
            };
            localStorage.setItem("gaia_current_user", JSON.stringify(clientUser));
            localStorage.setItem("gaia_active_role", clientUser.role);
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
