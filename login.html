<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Antares - Portal de Implantação</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    boxShadow: {
                        "apple": "0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02)",
                        "float": "0 20px 48px rgba(0, 0, 0, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.03)"
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
            -webkit-font-smoothing: antialiased;
        }
        .btn-hover-lift {
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-hover-lift:hover {
            transform: translateY(-1px);
        }
        .btn-hover-lift:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-[#f8f9fa] text-[#202124] font-sans min-h-screen flex items-center justify-center p-4 relative overflow-hidden select-none">

    <!-- Ambient Subtle Warm Light (Clean Apple/Google Aesthetic) -->
    <div class="fixed w-[600px] h-[600px] rounded-full bg-slate-200/40 blur-[140px] -top-40 -left-40 pointer-events-none z-0"></div>
    <div class="fixed w-[500px] h-[500px] rounded-full bg-blue-100/30 blur-[130px] bottom-0 right-0 pointer-events-none z-0"></div>

    <div class="w-full max-w-md relative z-10 space-y-6">
        
        <!-- Brand Header -->
        <div class="text-center flex flex-col items-center">
            <div class="w-16 h-16 rounded-2xl bg-white border border-[#e8eaed] flex items-center justify-center p-3 mb-4 shadow-apple">
                <img alt="Apdata Logo" class="h-10 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDxXygev2oQaXob1bxJZJ-aKnzu5pzwp8FwM5faMrOOLm-RbUuGGzGvJS4LTQDAR0hz-izp9EuqskE7JxI94fwljmYr7s5Erx08tGcrc0IM1hWpNDH0rSQTllMLFK3hJTQJW4z6oMLFjhamkIrM4oFY0KaZ4cwG_fK4DDQNdtmlxTskqChDbl8ttcBcMyD3lB5Jr1kveh9KmlDFloaHmoWesQu0jgCbKTKGKGbClGPqD2PzmrEMIDmDd1eGlrHDFmVia0o">
            </div>
            <h1 class="text-2xl font-extrabold text-[#1d1d1f] tracking-tight">Global Antares</h1>
            <div class="flex items-center gap-1.5 mt-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-xs font-semibold text-[#70757a]">Portal de Implantação e Parametrização</span>
            </div>
        </div>

        <!-- Login Card -->
        <div class="bg-white/90 backdrop-blur-xl border border-[#e8eaed] rounded-3xl p-8 shadow-float">
            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="username" class="block text-xs font-bold text-[#1d1d1f] uppercase tracking-wider mb-1.5">Usuário ou Empresa</label>
                    <div class="relative">
                        <input type="text" id="username" required placeholder="Digite seu usuário ou empresa" class="w-full bg-[#f8f9fa] border border-[#d2d5da] rounded-xl px-4 py-3 text-xs text-[#202124] focus:ring-2 focus:ring-[#1d1d1f] focus:border-[#1d1d1f] focus:bg-white outline-none transition-all placeholder-[#70757a]">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-bold text-[#1d1d1f] uppercase tracking-wider mb-1.5">Senha de Acesso</label>
                    <div class="relative">
                        <input type="password" id="password" required placeholder="Digite sua senha" class="w-full bg-[#f8f9fa] border border-[#d2d5da] rounded-xl px-4 py-3 text-xs text-[#202124] focus:ring-2 focus:ring-[#1d1d1f] focus:border-[#1d1d1f] focus:bg-white outline-none transition-all placeholder-[#70757a]">
                    </div>
                </div>

                <div id="error-msg" class="hidden text-xs text-rose-600 font-semibold text-center py-1">Usuário ou senha incorretos.</div>

                <button type="submit" id="btn-login" class="btn-hover-lift w-full bg-[#1d1d1f] hover:bg-black text-white py-3 px-4 rounded-xl text-xs font-bold tracking-wide transition-all shadow-sm flex items-center justify-center gap-2 cursor-pointer mt-2">
                    <span>Acessar Portal</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-[#f1f3f4] flex items-center justify-between text-xs text-[#70757a]">
                <a href="javascript:void(0)" class="hover:text-[#1d1d1f] hover:underline transition-colors">Esqueceu a Senha?</a>
                <a href="javascript:void(0)" class="hover:text-[#1d1d1f] hover:underline transition-colors">Precisa de Ajuda?</a>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center text-[11px] text-[#70757a]">
            &copy; Apdata &bull; Global Antares Onboarding Suite &bull; Engine v4.12
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            const btn = document.getElementById("btn-login");
            const err = document.getElementById("error-msg");

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Autenticando...';
            err.classList.add("hidden");

            // Modo Estático / Nuvem Serverless:
            // Salva a identificação da empresa/usuário no navegador (localStorage)
            const cleanUser = user ? user.trim() : "Cliente GAIA";
            const isConsultor = cleanUser.toLowerCase().includes("consultor") || cleanUser.toLowerCase().includes("admin") || cleanUser.toLowerCase() === "apdata";
            const clientUser = {
                role: isConsultor ? "consultor" : "cliente",
                name: cleanUser,
                client_id: "cli_" + btoa(encodeURIComponent(cleanUser)).replace(/[^a-zA-Z0-9]/g, "").substring(0, 16)
            };
            localStorage.setItem("gaia_current_user", JSON.stringify(clientUser));
            localStorage.setItem("gaia_active_role", clientUser.role);
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
